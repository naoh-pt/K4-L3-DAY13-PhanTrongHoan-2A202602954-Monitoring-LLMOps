alerts:
  - name: high_tail_latency
    severity: warning
    condition: p95_latency_ms > 3000
    duration: 5m
    type: symptom-based
    channel: "#alerts-llmops-l3a"
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 3m
    type: symptom-based
    channel: "#alerts-llmops-l3a"
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-2
  - name: retrieval_failure_rate
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: "#alerts-llmops-l3a"
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-3
